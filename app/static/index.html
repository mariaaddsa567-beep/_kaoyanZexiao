<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研择校助手 · 408 专项</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header>
  <div class="logo">考研择校助手<span class="sub">408 专项 · 985/211</span></div>
  <nav>
    <button class="tab active" data-tab="rec">冲稳保推荐</button>
    <button class="tab" data-tab="lib">院校库</button>
    <button class="tab" data-tab="cmp">志愿对比 <span id="fav-badge" class="fav-badge"></span></button>
  </nav>
</header>

<main>
<!-- ======== 冲稳保推荐 ======== -->
<section id="tab-rec" class="tab-page active">
  <div class="panel">
    <h2>考生画像 <span class="hint">仅填部分字段也可用（文档 P0-1）</span></h2>
    <div class="form-grid">
      <label>预估总分(500) <input id="pf-total" type="number" min="0" max="500" placeholder="如 330"></label>
      <label>政治分(选填) <input id="pf-politics" type="number" min="0" max="100" placeholder="校验单科线"></label>
      <label>英语分(选填) <input id="pf-english-score" type="number" min="0" max="100" placeholder="校验单科线"></label>
      <label>数学类型
        <select id="pf-math"><option value="">不限</option><option>数一</option><option>数二</option></select></label>
      <label>英语类型
        <select id="pf-english"><option value="">不限</option><option>英一</option><option>英二</option></select></label>
      <label>学硕/专硕
        <select id="pf-degree"><option value="">不限</option><option>学硕</option><option>专硕</option></select></label>
      <label class="span2">目标省份 <select id="pf-prov" multiple size="4"></select></label>
      <label class="span2">院校层次
        <span class="chk-row">
          <input type="checkbox" id="pf-lv985" value="985"><em>985</em>
          <input type="checkbox" id="pf-lv211" value="211"><em>211</em>
        </span></label>
    </div>
    <button id="btn-rec" class="primary">生成冲稳保推荐</button>
    <span id="rec-status" class="hint"></span>
  </div>
  <div id="rec-result"></div>
</section>

<!-- ======== 院校库 ======== -->
<section id="tab-lib" class="tab-page">
  <div class="filters">
    <input id="f-k" placeholder="搜索校名/代码">
    <select id="f-prov"><option value="">全部省份</option></select>
    <select id="f-tag">
      <option value="all">全部</option><option value="985">985</option>
      <option value="211">211</option><option value="zhx">自划线</option>
    </select>
    <select id="f-group">
      <option value="">全部专业类</option><option value="cs">0812 计算机</option>
      <option value="se">0835 软工</option><option value="cyb">0839 网安</option>
      <option value="xx">0854 电子信息</option>
    </select>
    <select id="f-408"><option value="">含自命题</option><option value="1">仅408统考</option></select>
    <select id="f-sort">
      <option value="sr_rank">综合排名</option><option value="sr_cs_rank">计算机学科排名</option>
      <option value="quota">招生名额</option><option value="name">按省份名</option>
    </select>
  </div>
  <div id="stats" class="hint"></div>
  <div id="grid" class="grid"></div>
</section>

<!-- ======== 志愿对比 ======== -->
<section id="tab-cmp" class="tab-page">
  <div class="panel">
    <h2>志愿对比 <span class="hint">在院校库点「对比」加入，最多 5 所</span></h2>
    <button id="btn-cmp-clear" class="ghost">清空</button>
  </div>
  <div id="cmp-wrap"><p class="hint">尚未添加对比院校。</p></div>
</section>
</main>

<!-- 详情弹层 -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <button id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>数据来源：研招网 / 软科 / 各校公告（OCR 识别，置信度见标注）· 仅供参考，以官方公告为准</footer>
<script src="app.js?v=5"></script>
</body>
</html>
